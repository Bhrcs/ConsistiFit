name: ConsistiFit Web CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: consistifit-web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
        env:
          CONSISTIFIT_BUILD_ID: ${{ github.sha }}
      - run: npm run verify:web
      - uses: actions/upload-artifact@v7
        with:
          name: consistifit-web-${{ github.sha }}
          path: dist
          retention-days: 7
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
