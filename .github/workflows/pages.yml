name: Deploy PWA to GitHub Pages
on:
  workflow_run:
    workflows: ["ConsistiFit Web CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or commit SHA to deploy. Use an older commit to roll back."
        required: false
        default: "main"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Resolve exact deploy commit
        run: |
          echo "CONSISTIFIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CONSISTIFIT_BUILD_ID=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npm run verify:web
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify exact commit is live
        env:
          CONSISTIFIT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          sleep 10
          CONSISTIFIT_EXPECTED_COMMIT="$CONSISTIFIT_COMMIT" npm run check:production
