<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ConsistiFit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<title>ConsistiFit</title>
<style>html,body{margin:0;background:#050606;color:#fff;font-family:system-ui,-apple-system,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}#loading b{display:block;font-size:28px;margin-bottom:8px;color:#d7ff3f}#loading span{color:#8d9390;font-size:13px}</style>
</head>
<body>
<div id="loading"><div><b>ConsistiFit</b><span>Loading prototype…</span></div></div>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(console.error));}
(async()=>{
  try{
    const files=[1,2,3,4,5,6].map(n=>`payload/payload${n}.txt`);
    const responses=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'})));
    if(responses.some(r=>!r.ok)) throw new Error('Could not load prototype payload');
    const b64=(await Promise.all(responses.map(r=>r.text()))).join('').replace(/\s+/g,'');
    const binary=atob(b64);
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const source=await new Response(stream).text();
    document.open(); document.write(source); document.close();
  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML='<div><b>ConsistiFit</b><span>Prototype failed to load. Refresh or use a current version of Safari/Chrome.</span></div>';
  }
})();
</script>
</body>
</html>
