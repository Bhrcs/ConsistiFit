<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ConsistiFit">
<meta name="description" content="ConsistiFit playable local fitness progression demo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="plan-builder.css">
<link rel="stylesheet" href="exercise-guides.css">
<title>ConsistiFit</title>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">Consisti<span>Fit</span></div>
    <button id="installButton" class="ghost small hidden" onclick="installApp()">Install</button>
    <div class="wallet" id="wallet">◈ 200 · Iron III</div>
  </header>

  <section class="screen active" id="screen-home"></section>
  <section class="screen" id="screen-missions"></section>
  <section class="screen" id="screen-rank"></section>
  <section class="screen" id="screen-progress"></section>
  <section class="screen" id="screen-profile"></section>
</main>

<nav class="bottomnav" aria-label="Primary navigation">
  <button class="active" data-screen="home" onclick="showScreen('home')"><span class="navicon">⌂</span>Home</button>
  <button data-screen="missions" onclick="showScreen('missions')"><span class="navicon">✓</span>Missions</button>
  <button data-screen="rank" onclick="showScreen('rank')"><span class="navicon">◇</span>Rank</button>
  <button data-screen="progress" onclick="showScreen('progress')"><span class="navicon">▥</span>Progress</button>
  <button data-screen="profile" onclick="showScreen('profile')"><span class="navicon">○</span>Profile</button>
</nav>

<div class="overlay" id="workoutOverlay" aria-label="Workout session">
  <div class="workout-wrap" id="workoutContent"></div>
</div>

<div class="sheetback" id="sheetBack" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheetContent"></div>
</div>
<div class="toast" id="toast"></div>

<script src="demo-app.js"></script>
<script src="plan-builder.js"></script>
<script src="exercise-library.js"></script>
</body>
</html>
